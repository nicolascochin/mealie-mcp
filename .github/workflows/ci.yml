name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=github-actions

      - name: Build
        run: npm run build

  live:
    # Integration suite against a disposable Mealie (docker-compose.test.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Integration tests
        run: npm run test:live

      - name: Mealie logs
        if: failure()
        run: docker compose -f docker-compose.test.yml -p mealie-mcp-test logs --no-color || true
